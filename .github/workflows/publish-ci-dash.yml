name: Publish CI Dash

on:
  push:
    tags:
      - "ci-dash-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-dash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ci-dash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/ci-dash-v')
        run: |
          expected="ci-dash-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Setup Node.js 24 for staged publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with staged publishing
        run: npm install --global npm@11.20.0

      - name: Stage the npm release with provenance
        run: npm stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ask for the staged release approval
        run: |
          {
            echo "### npm release staged"
            echo "Approve it with 2FA: \`npm stage list @dougcunha/ci-dash\`, then \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/ci-dash-v')
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
